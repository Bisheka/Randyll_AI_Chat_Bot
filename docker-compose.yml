# Randyll Overseas AI Counselling Agent
# SQL Server is an EXTERNAL existing database — set SQLSERVER_DSN in .env when
# its documented schema/credentials are available; it is never run here.
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant_storage:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    ports: ["8000:8000"]
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-opus-5-5}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=randyll_university_knowledge
      - ADMIN_API_KEY=${ADMIN_API_KEY:-dev-admin-key-change-me}
      - SQLSERVER_DSN=${SQLSERVER_DSN:-}
      - KNOWLEDGE_DIR=/knowledge
    volumes:
      - backend_data:/data
      - ${KNOWLEDGE_HOST_DIR:-./university_knowledge}:/knowledge:ro
    depends_on:
      qdrant: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on: [backend]

volumes:
  qdrant_storage:
  backend_data:
